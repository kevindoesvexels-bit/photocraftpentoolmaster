
    
  
        shell: bash
        run: |
          set -euo pipefail
          echo "build_tag=photocraft-custom-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          {
            echo "PhotoCraft custom build"
            echo "Base release: ${{ inputs.base_release_url }}"
            echo "Camera RAW release: ${{ inputs.camera_raw_release_url }}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo "Applied PR URLs:"
            cat pr-urls.txt
          } > BUILD-INFO.txt

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-patched-source
          path: |
            .
            !.git/**
            !target/**
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: photocraft-windows-x64
            binary: photocraft.exe
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: photocraft-linux-x64
            binary: photocraft
          - name: macOS Intel x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: photocraft-macos-intel-x64
            binary: photocraft
          - name: macOS Apple Silicon ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: photocraft-macos-apple-silicon-arm64
            binary: photocraft
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: photocraft-patched-source
          path: source

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install pkg-config
          if ! brew list gtk+3 >/dev/null 2>&1; then brew install gtk+3; fi

      - name: Build PhotoCraft
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" -p photocraft

      - name: Package build
        shell: bash
        working-directory: source
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p "package-${ARTIFACT}"
          cp "target/${TARGET}/release/${BINARY}" "package-${ARTIFACT}/"
          cp BUILD-INFO.txt "package-${ARTIFACT}/"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            tar -czf "${ARTIFACT}.tar.gz" "package-${ARTIFACT}"
          else
            cd "package-${ARTIFACT}"
            7z a "../${ARTIFACT}.zip" .
          fi

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: source/${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 14

